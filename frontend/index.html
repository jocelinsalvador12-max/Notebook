<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Notas - Melt</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar lateral -->
        <aside class="sidebar">
            <div>
                <h2>Inicio</h2>
            </div>
            <button class="nav-btn trash-btn" onclick="alert('Papelera vacía')">Papelera</button>
        </aside>

        <!-- Contenido Central -->
        <main class="main-content">
            <header class="greeting-header">
                <h1 id="greeting">Buenos días</h1>
            </header>

            <!-- 3 Tarjetas Superiores del boceto -->
            <section class="top-cards">
                <div class="card-action card-new" onclick="abrirEditor()">+ Nueva Nota</div>
                <div class="card-action card-favs">Favoritos</div>
                <div class="card-action card-categories">Categorías</div>
            </section>

            <!-- Cuadrícula de Notas Recientes -->
            <h2 class="section-title">Tareas recientes:</h2>
            <div class="notes-grid" id="notes-list"></div>
        </main>
    </div>

    <!-- Modal para crear / editar nota sin perder la lógica CRUD -->
    <div class="editor-modal" id="editor-modal">
        <div class="editor-content">
            <input type="hidden" id="note-id">
            <input type="text" id="note-title" placeholder="Título de la nota...">
            <textarea id="note-content" placeholder="Escribe tu nota aquí..."></textarea>

            <div class="actions">
                <button class="btn-close" onclick="cerrarEditor()">Cancelar</button>
                <button class="btn-save" onclick="guardarNota()">Guardar</button>
                <button id="btn-delete" class="btn-danger" onclick="eliminarNota()">Eliminar</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
