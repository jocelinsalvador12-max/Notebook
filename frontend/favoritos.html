<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #D6BEEA 0%, #7FB9E6 100%);
            background-attachment: fixed;
            padding: 40px;
        }

        .favoritos-container {
            max-width: 900px;
            margin: 0 auto;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 24px;
            background: #FFFFFF;
            color: #333333;
            padding: 10px 20px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.1);
        }

        .favoritos-title {
            font-size: 38px;
            font-weight: 700;
            color: #FFFFFF;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 0.15);
            margin-bottom: 30px;
        }

        .favorite-row {
            display: flex;
            align-items: center;
            gap: 22px;
            padding: 20px 30px;
            border-radius: 999px;
            margin-bottom: 18px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
            border: 3px solid rgba(255, 255, 255, 0.7);
        }

        .fav-number {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            flex-shrink: 0;
        }

        .fav-text {
            flex: 1;
        }

        .fav-text h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .fav-text p {
            font-size: 14px;
            opacity: 0.9;
        }

        .btn-unfav {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 17px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-unfav:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .empty-msg {
            color: #FFFFFF;
            font-weight: 600;
            font-size: 16px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>

<body>

    <div class="favoritos-container">
        <a href="index.html" class="back-btn">← Volver</a>
        <h1 class="favoritos-title">Favoritos ⭐</h1>
        <div id="favoritos-list"></div>
    </div>

    <script src="favoritos.js"></script>
</body>

</html>
