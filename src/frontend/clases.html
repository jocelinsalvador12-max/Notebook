<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="./styles.css">
</head>

<body>

        <aside class="sidebar">
            <div class="sidebar-top">

                    <a href="./app.html" class="nav-item">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                            <rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        <span>Inicio</span>
                    </a>
                    <a href="./clases.html" class="nav-item active">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        <span>Clases</span>
                    </a>
                    <a href="./calendario.html" class="nav-item">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                            <line x1="8" y1="14" x2="8" y2="14"></line><line x1="12" y1="14" x2="12" y2="14"></line><line x1="16" y1="14" x2="16" y2="14"></line>
                        </svg>
                        <span>Calendario</span>
                    </a>
                    <a href="./favoritos.html" class="nav-item card-favs">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                        </svg>
                        <span>Favoritos</span>
                    </a>
                    <a href="./categorias.html" class="nav-item card-categories">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <span>Carpetas</span>
                    </a>
                    <a href="./papelera.html" class="nav-item trash-btn">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                        <span>Papelera</span>

                </nav>
                <div class="sidebar-category-scroll" id="sidebar-category-scroll">
                    <div class="sidebar-categories" id="sidebar-user-folders"></div>
                </div>
            </div>
            <div class="sidebar-footer">
                <div class="social-icons">
                    <a href="#" aria-label="Facebook"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg></a>
                    <a href="#" aria-label="Twitter"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"></path></svg></a>
                    <a href="#" aria-label="LinkedIn"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2zM4 6a2 2 0 1 1-2-2 2 2 0 0 1 2 2z"></path></svg></a>
                </div>
                <div class="copyright-text">© 2026 Todos los derechos reservados</div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-navbar">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-input" placeholder="Buscar materias o notas..." autocomplete="off" />
                    <button id="search-clear-btn" class="search-clear" title="Limpiar búsqueda" style="display:none;">×</button>
                </div>
                <div class="user-profile">
                    <div class="avatar-wrapper">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Avatar" class="avatar-img" />
                    </div>
                    <span class="user-greeting">¡Hola, Peter!</span>
                    <button class="btn-notification" title="Notificaciones">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span class="notif-dot"></span>
                    </button>
                </div>
            </header>

            <section class="action-bar" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 24px;">
                <h2 style="font-size:1.4rem;font-weight:700;color:var(--text-title);margin:0; display:flex; align-items:center; gap:10px;">
                    📚 Mis clases
                </h2>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <button id="btn-add-folder" class="btn-quick-class-note" type="button">＋ Crear clase</button>
                    <button id="btn-quick-class-note" class="btn-quick-class-note" type="button">✎ Nuevo apunte</button>
                </div>
            </section>

            <p class="classes-intro">Cada clase es un espacio para guardar tus apuntes y tenerlos a la mano.</p>

            <div class="categories-grid"><!-- Se llena automáticamente con JS --></div>
        </main>
    </div>

    <!-- Editor para crear un apunte sin salir de Clases -->
    <div id="editor-modal" class="editor-modal">
        <div class="editor-content class-note-editor">
            <div class="modal-header">
                <h2>Nuevo apunte</h2>
                <button id="modal-close-icon" class="modal-close-btn" type="button">&times;</button>
            </div>
            <input type="text" id="note-title" placeholder="Título del apunte..." required />
            <textarea id="note-content" placeholder="Escribe aquí lo aprendido en clase..." required></textarea>
            <div class="form-row">
                <div class="color-picker-container">
                    <label>Color pastel:</label>
                    <div class="color-swatches" id="color-swatches">
                        <button type="button" class="swatch-btn selected" data-color="card-lavender" style="background-color: #E8C0FC;" title="Lavanda"></button>
                        <button type="button" class="swatch-btn" data-color="card-blue" style="background-color: #A8DEFA;" title="Azul"></button>
                        <button type="button" class="swatch-btn" data-color="card-mint" style="background-color: #D0F4E0;" title="Menta"></button>
                        <button type="button" class="swatch-btn" data-color="card-yellow" style="background-color: #FCF5BF;" title="Amarillo"></button>
                        <button type="button" class="swatch-btn" data-color="card-pink" style="background-color: #FF99C8;" title="Rosa"></button>
                    </div>
                    <input type="hidden" id="note-color" value="card-lavender" />
                </div>
                <div class="category-select-container">
                    <label for="note-category">Clase:</label>
                    <select id="note-category" class="form-control"></select>
                </div>
            </div>
            <div class="form-row dates-row">
                <div class="date-input-container">
                    <label for="note-assigned">📌 Se asignó:</label>
                    <input type="datetime-local" id="note-assigned" class="form-control" />
                </div>
                <div class="date-input-container">
                    <label for="note-due">⏰ Fecha de entrega:</label>
                    <input type="datetime-local" id="note-due" class="form-control" />
                </div>
            </div>
            <div class="modal-actions">
                <button id="btn-cancel" class="btn-cancel" type="button">Cancelar</button>
                <button id="btn-save-note" class="btn-save" type="button">Guardar apunte</button>
            </div>
        </div>
    </div>

    <!-- Modal para crear clase -->
    <div id="folder-modal" class="editor-modal">
        <div class="editor-content" style="max-width: 440px;">
            <div class="modal-header">
                <h2>Nueva clase</h2>
                <button id="folder-modal-close" class="modal-close-btn">&times;</button>
            </div>
            <p style="font-size: 13.5px; color: var(--text-muted); margin: 0;">Crea una clase para organizar tus apuntes:</p>
            
            <label for="folder-name-input" style="font-size: 13px; font-weight: 600; color: var(--text-body);">Nombre de la clase:</label>
            <input type="text" id="folder-name-input" placeholder="Ej. Matemáticas, Historia, Programación..." required />

            <div class="form-row">
                <div class="color-picker-container">
                    <label>Color de la carpeta:</label>
                    <div class="color-swatches" id="folder-color-swatches">
                        <button type="button" class="swatch-btn selected" data-color="#FCF5BF" style="background-color: #FCF5BF;" title="Amarillo pastel"></button>
                        <button type="button" class="swatch-btn" data-color="#A8DEFA" style="background-color: #A8DEFA;" title="Azul pastel"></button>
                        <button type="button" class="swatch-btn" data-color="#FF99C8" style="background-color: #FF99C8;" title="Rosa pastel"></button>
                        <button type="button" class="swatch-btn" data-color="#D0F4E0" style="background-color: #D0F4E0;" title="Menta pastel"></button>
                        <button type="button" class="swatch-btn" data-color="#E8C0FC" style="background-color: #E8C0FC;" title="Lavanda pastel"></button>
                    </div>
                    <input type="hidden" id="folder-color-val" value="#FCF5BF" />
                </div>
            </div>

            <div class="modal-actions">
                <button id="folder-modal-cancel" class="btn-cancel">Cancelar</button>
                <button id="folder-modal-save" class="btn-save">Crear clase</button>
            </div>
        </div>
    </div>

    <script type="module" src="./script.js"></script>
</body>
</html>
