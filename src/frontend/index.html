<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notebook - Dashboard de Notas</title>
    <!-- Fuentes modernas para replicar el diseño de la Imagen 1 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="app-container">
        <!-- Barra lateral (Sidebar con estética Imagen 1 y paleta Imagen 2) -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <!-- Marca / Perfil superior redondeado -->
                <div class="sidebar-brand">
                    <div class="brand-avatar-circle"></div>
                    <div class="brand-title-bar"></div>
                </div>

                <!-- Menú de navegación principal -->
                <nav class="sidebar-nav">
                    <a href="./index.html" class="nav-item">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        <span>Overview</span>
                    </a>
                    <a href="#tasks" class="nav-item">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        <span>Tasks</span>
                    </a>
                    <a href="#documents" class="nav-item">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        <span>Documents</span>
                    </a>
                    <!-- Pestaña Activa con curva suave hacia el contenido -->
                    <a href="./index.html" class="nav-item active">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                        </svg>
                        <span>Notes</span>
                    </a>
                    <a href="./favoritos.html" class="nav-item card-favs">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                        </svg>
                        <span>Favorites</span>
                    </a>
                    <a href="./categorias.html" class="nav-item card-categories">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <span>Categories</span>
                    </a>
                    <a href="./papelera.html" class="nav-item trash-btn">
                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                        <span>Trash</span>
                    </a>
                </nav>

                <!-- Categorías / Etiquetas con viñetas de colores de la Imagen 2 -->
                <div class="sidebar-categories">
                    <div class="category-tag-item" data-category="Projects">
                        <span class="category-dot dot-yellow"></span>
                        <span class="category-label">Projects</span>
                    </div>
                    <div class="category-tag-item" data-category="Business">
                        <span class="category-dot dot-pink"></span>
                        <span class="category-label">Business</span>
                    </div>
                    <div class="category-tag-item" data-category="Personal">
                        <span class="category-dot dot-blue"></span>
                        <span class="category-label">Personal</span>
                    </div>
                    <div class="category-tag-item" data-category="General">
                        <span class="category-dot dot-green"></span>
                        <span class="category-label">General</span>
                    </div>
                    <button class="btn-add-tag card-new" id="btn-sidebar-add-new">+ Add new</button>
                </div>
            </div>

            <!-- Pie de la barra lateral con redes y copyright -->
            <div class="sidebar-footer">
                <div class="social-icons">
                    <a href="#" aria-label="Facebook">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>
                    </a>
                    <a href="#" aria-label="Twitter">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"></path></svg>
                    </a>
                    <a href="#" aria-label="LinkedIn">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2zM4 6a2 2 0 1 1-2-2 2 2 0 0 1 2 2z"></path></svg>
                    </a>
                </div>
                <div class="copyright-text">© 2026 All rights reserved</div>
            </div>
        </aside>

        <!-- Contenedor Principal -->
        <main class="main-content">
            <!-- Barra superior con Buscador y Perfil de Usuario (Exacto a Imagen 1) -->
            <header class="top-navbar">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-input" placeholder="Search" autocomplete="off" />
                    <button id="search-clear-btn" class="search-clear" title="Limpiar búsqueda" style="display: none;">×</button>
                </div>

                <div class="user-profile">
                    <div class="avatar-wrapper">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Avatar" class="avatar-img" />
                    </div>
                    <span class="user-greeting">Hello, Peter!</span>
                    <button class="btn-notification" title="Notificaciones">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span class="notif-dot"></span>
                    </button>
                </div>
            </header>

            <!-- Fila de Filtros de Pestañas y Botón "+ Add new note" -->
            <section class="action-bar">
                <div class="filter-tabs">
                    <button class="filter-tab active" data-category="All">All</button>
                    <button class="filter-tab" data-category="Projects">Projects</button>
                    <button class="filter-tab" data-category="Business">Business</button>
                    <button class="filter-tab" data-category="Personal">Personal</button>
                    <button class="filter-tab" data-category="General">General</button>
                </div>

                <button class="btn-add-note card-new" id="btn-add-note">
                    <span class="plus-icon-circle">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </span>
                    <span>Add new note</span>
                </button>
            </section>

            <!-- Mensaje de estado de búsqueda o filtro -->
            <div id="filter-feedback" class="filter-feedback" style="display: none;"></div>

            <!-- Cuadrícula de Tarjetas de Notas (Diseño limpio como Imagen 1) -->
            <div id="notes-container" class="notes-grid">
                <!-- Las notas guardadas se dibujan aquí dinámicamente -->
            </div>
        </main>
    </div>

    <!-- Modal para crear / editar notas con paleta de colores de Imagen 2 -->
    <div id="editor-modal" class="editor-modal">
        <div class="editor-content">
            <div class="modal-header">
                <h2>Nueva Nota</h2>
                <button id="modal-close-icon" class="modal-close-btn">&times;</button>
            </div>
            
            <input type="text" id="note-title" placeholder="Título de la nota..." required />
            <textarea id="note-content" placeholder="Escribe el contenido de tu nota aquí..." required></textarea>

            <div class="form-row">
                <div class="color-picker-container">
                    <label>Color pastel:</label>
                    <div class="color-swatches" id="color-swatches">
                        <button type="button" class="swatch-btn selected" data-color="card-lavender" style="background-color: #E8C0FC;" title="Lavanda (#E8C0FC)"></button>
                        <button type="button" class="swatch-btn" data-color="card-blue" style="background-color: #A8DEFA;" title="Azul (#A8DEFA)"></button>
                        <button type="button" class="swatch-btn" data-color="card-mint" style="background-color: #D0F4E0;" title="Menta (#D0F4E0)"></button>
                        <button type="button" class="swatch-btn" data-color="card-yellow" style="background-color: #FCF5BF;" title="Amarillo (#FCF5BF)"></button>
                        <button type="button" class="swatch-btn" data-color="card-pink" style="background-color: #FF99C8;" title="Rosa (#FF99C8)"></button>
                    </div>
                    <input type="hidden" id="note-color" value="card-lavender" />
                </div>

                <div class="category-select-container">
                    <label for="note-category">Categoría:</label>
                    <select id="note-category" class="form-control">
                        <option value="Projects">Projects</option>
                        <option value="Business">Business</option>
                        <option value="Personal">Personal</option>
                        <option value="General" selected>General</option>
                        <option value="Trabajo">Trabajo</option>
                        <option value="Escuela">Escuela</option>
                        <option value="Casa">Casa</option>
                    </select>
                </div>
            </div>

            <div class="modal-actions">
                <button id="btn-cancel" class="btn-cancel">Cancelar</button>
                <button id="btn-save-note" class="btn-save">Guardar Nota</button>
            </div>
        </div>
    </div>

    <!-- Enlace al script de integración y lógica -->
    <script type="module" src="./script.js"></script>
</body>

</html>
