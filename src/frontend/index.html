<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Aplicación de Notas</title>
    <!-- Enlace imprescindible para cargar el CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Inicio</h2>
            <button class="nav-btn trash-btn">Papelera</button>
        </aside>

        <!-- Contenido Principal -->
        <main class="main-content">
            <header class="greeting-header">
                <h1>Buenos días</h1>
            </header>

            <!-- Botones de Acción Superiores -->
            <section class="top-cards">
                <button class="card-action card-new">+ Nueva Nota</button>
                <button class="card-action card-favs">Favoritos</button>
                <button class="card-action card-categories">Categorías</button>
            </section>

            <!-- Título de Sección -->
            <h2 class="section-title">Tareas recientes</h2>

            <!-- Cuadrícula dinámicamente conectada a Turso DB -->
            <div id="notes-container" class="notes-grid">
                <!-- Las tarjetas registradas en la base de datos se dibujan aquí automáticamente -->
            </div>
        </main>
    </div>

    <!-- Modal para crear / editar notas -->
    <div id="editor-modal" class="editor-modal">
        <div class="editor-content">
            <h2>Nueva Nota</h2>
            <input type="text" id="note-title" placeholder="Título de la nota..." />
            <textarea id="note-content" placeholder="Escribe el contenido aquí..."></textarea>

            <div class="color-picker">
                <label for="note-color">Color de la tarjeta:</label>
                <select id="note-color">
                    <option value="card-peach">Durazno</option>
                    <option value="card-lavender">Lavanda</option>
                    <option value="card-mint">Menta</option>
                </select>
            </div>

            <div class="form-group">
                <label for="note-category">Categoría:</label>
                <select id="note-category" class="form-control">
                    <option value="General">General</option>
                    <option value="Trabajo">Trabajo</option>
                    <option value="Escuela">Escuela</option>
                    <option value="Casa">Casa</option>
                </select>
            </div>

            <div class="actions">
                <button id="btn-cancel" class="btn-close">Cancelar</button>
                <button id="btn-save-note" class="btn-save">Guardar Nota</button>
            </div>
        </div>
    </div>

    <!-- Enlace al script de integración -->
    <script src="./script.js"></script>
</body>

</html>
