<!DOCTYPE html>

                        <span>Favoritos</span>
                    </a>

                        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                    </a>

            </div>
            <div class="sidebar-footer">
                <div class="social-icons">
                    <a href="#" aria-label="Facebook"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg></a>

        <main class="main-content">
            <header class="top-navbar">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="search-input" placeholder="Buscar" autocomplete="off" />
                    <button id="search-clear-btn" class="search-clear" title="Limpiar búsqueda" style="display:none;">×</button>
                </div>
                <div class="user-profile">
                    <div class="avatar-wrapper">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Avatar" class="avatar-img" />
                    </div>
                    <span class="user-greeting">¡Hola, Peter!</span>
                    <button class="btn-notification" title="Notificaciones">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                        <span class="notif-dot"></span>
                    </button>
                </div>

            <section class="action-bar">
                <h2 style="font-size:1.3rem;font-weight:700;color:var(--text-primary);margin:0;">🗑️ Papelera de Reciclaje</h2>

            <div id="filter-feedback" class="filter-feedback" style="display:none;"></div>
            <div id="trashGrid" class="trash-grid"><!-- Se llena dinámicamente desde el JS --></div>
        </main>
    </div>
    <script type="module" src="./script.js"></script>

</html>
