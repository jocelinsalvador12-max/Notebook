<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#a855f7">
    <title>Notebook - Crear cuenta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../login/login.css">
</head>
<body>
    <main class="login-page">
        <section class="login-shell" aria-labelledby="brand-name">
            <a class="brand" href="../app.html" aria-label="Notebook, ir a la aplicación">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 32 32" fill="none"><rect x="3" y="3" width="26" height="26" rx="8" stroke="currentColor" stroke-width="2.5"/><path d="m10 21 2.1-6.1L22 5l5 5-9.9 9.9L11 22Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="m18.5 8.5 5 5" stroke="currentColor" stroke-width="2"/></svg>
                </span>
                <span id="brand-name">Notebook</span>
            </a>

            <form class="login-card" id="register-form">
                <h1>Crea tu cuenta</h1>
                <p class="subtitle">Guarda tus ideas en un solo lugar</p>

                <label for="username">Usuario</label>
                <input id="username" name="username" type="text" placeholder="Elige un nombre de usuario" autocomplete="username" maxlength="50" required>

                <label for="email">Correo electrónico</label>
                <input id="email" name="email" type="email" placeholder="tu@correo.com" autocomplete="email" maxlength="254" required>

                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" placeholder="Al menos 8 caracteres" autocomplete="new-password" minlength="8" maxlength="72" required>

                <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
                <button class="login-button" type="submit">Crear cuenta</button>

                <p class="signup-prompt">¿Ya tienes cuenta? <a href="../login/index.html">Inicia sesión</a></p>
            </form>
            <p class="login-footer">Tus ideas, siempre contigo.</p>
        </section>
    </main>
    <script>
        const form = document.getElementById('register-form');
        const message = document.getElementById('form-message');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const button = form.querySelector('button[type="submit"]');
            button.disabled = true;
            message.textContent = 'Creando tu cuenta…';
            message.classList.remove('is-error');
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        email: document.getElementById('email').value.trim(),
                        password: document.getElementById('password').value
                    })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'No se pudo crear la cuenta.');
                localStorage.setItem('notebookUsername', result.user.username);
                window.location.href = '../app.html';
            } catch (error) {
                message.textContent = error.message || 'No se pudo conectar con el servidor.';
                message.classList.add('is-error');
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
