    <style>
        /* ── Calendario styles ── */
        /* Overrides: quitar padding extra del main-content para el calendario */
        .main-content {
            padding: 28px 32px 32px 32px !important;
        }

        .calendar-wrapper {
            display: flex;
            flex-direction: column;
            gap: 18px;
            flex: 1;
            min-height: 0;
        }

        .cal-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .cal-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cal-title {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.55rem;
            font-weight: 700;
            color: #5B21B6;
            min-width: 220px;
        }

        .cal-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: rgba(139,92,246,0.12);
            color: #7C3AED;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .cal-btn:hover { background: rgba(139,92,246,0.25); }

        .cal-view-tabs {
            display: flex;
            gap: 6px;
            background: rgba(139,92,246,0.08);
            border-radius: 10px;
            padding: 4px;
        }

        .cal-view-tab {
            padding: 6px 16px;
            border-radius: 8px;
            border: none;
            background: transparent;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            color: #7C3AED;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cal-view-tab.active {
            background: #7C3AED;
            color: #fff;
            box-shadow: 0 2px 8px rgba(124,58,237,0.35);
        }

        /* ── Month grid ── */
        .cal-grid {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(100,50,180,0.09);
            overflow: hidden;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .cal-header-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: linear-gradient(135deg, #7C3AED 0%, #A855F7 100%);
        }

        .cal-day-name {
            padding: 12px 0;
            text-align: center;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            color: rgba(255,255,255,0.85);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .cal-cells {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-auto-rows: minmax(0, 1fr);
            flex: 1;
            min-height: 0;
        }

        .cal-cell {
            min-height: 0;
            border-right: 1px solid rgba(139,92,246,0.07);
            border-bottom: 1px solid rgba(139,92,246,0.07);
            padding: 8px 10px;
            position: relative;
            transition: background 0.15s;
        }
        .cal-cell:hover { background: rgba(139,92,246,0.04); }
        .cal-cell.other-month { opacity: 0.35; }
        .cal-cell.today { background: rgba(168,85,247,0.07); }

        .cal-day-num {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            color: #374151;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .cal-cell.today .cal-day-num {
            background: #7C3AED;
            color: #fff;
            box-shadow: 0 2px 8px rgba(124,58,237,0.4);
        }

        /* ── Week view ── */
        .week-view {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(100,50,180,0.09);
            overflow: hidden;
            flex: 1;
        }

        .week-header {
            display: grid;
            grid-template-columns: 60px repeat(7, 1fr);
            background: linear-gradient(135deg, #7C3AED 0%, #A855F7 100%);
        }

        .week-time-col { padding: 12px 0; }

        .week-day-col {
            padding: 10px 6px;
            text-align: center;
            border-left: 1px solid rgba(255,255,255,0.15);
        }

        .week-day-label {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            color: rgba(255,255,255,0.75);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .week-day-num {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: #fff;
            margin-top: 2px;
        }
        .week-day-num.today-num {
            background: rgba(255,255,255,0.25);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 2px auto 0;
        }

        .week-body {
            display: grid;
            grid-template-columns: 60px repeat(7, 1fr);
            max-height: 480px;
            overflow-y: auto;
        }

        .week-times {
            border-right: 1px solid rgba(139,92,246,0.1);
        }

        .week-hour-label {
            height: 56px;
            display: flex;
            align-items: flex-start;
            padding: 4px 8px 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.7rem;
            color: #9CA3AF;
            font-weight: 500;
        }

        .week-day-slots {
            border-left: 1px solid rgba(139,92,246,0.07);
        }

        .week-hour-slot {
            height: 56px;
            border-bottom: 1px solid rgba(139,92,246,0.06);
        }
        .week-hour-slot.current-hour {
            background: rgba(168,85,247,0.05);
        }
    </style>
</head>

    <script>
    (() => {
        const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
        const DIAS_CORTOS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

        // Estado
        const now = new Date();
        // Fijamos en 2026; si estamos en 2026 usamos mes actual, si no usamos Septiembre
        let currentYear = 2026;
        let currentMonth = (now.getFullYear() === 2026) ? now.getMonth() : 8; // 8 = Septiembre
        let currentView = 'mes';

        const calTitle = document.getElementById('cal-title');
        const calCells = document.getElementById('cal-cells');

        // ── Renderizar vista Mes ──
        function renderMes() {
            calTitle.textContent = `${MESES[currentMonth]} ${currentYear}`;

            const firstDay = new Date(currentYear, currentMonth, 1).getDay(); // 0=Dom
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const daysInPrev = new Date(currentYear, currentMonth, 0).getDate();

            calCells.innerHTML = '';

            // Celdas del mes anterior
            for (let i = firstDay - 1; i >= 0; i--) {
                const cell = makeCell(daysInPrev - i, true, false);
                calCells.appendChild(cell);
            }

            // Celdas del mes actual
            for (let d = 1; d <= daysInMonth; d++) {
                const isToday = (now.getFullYear() === currentYear && now.getMonth() === currentMonth && now.getDate() === d);
                calCells.appendChild(makeCell(d, false, isToday));
            }

            // Celdas del mes siguiente para completar la cuadrícula
            const total = firstDay + daysInMonth;
            const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
            for (let d = 1; d <= remaining; d++) {
                calCells.appendChild(makeCell(d, true, false));
            }
        }

        function makeCell(day, otherMonth, isToday) {
            const cell = document.createElement('div');
            cell.className = 'cal-cell' + (otherMonth ? ' other-month' : '') + (isToday ? ' today' : '');
            const num = document.createElement('div');
            num.className = 'cal-day-num';
            num.textContent = day;
            cell.appendChild(num);
            return cell;
        }

        // ── Renderizar vista Semana ──
        function renderSemana() {
            calTitle.textContent = `${MESES[currentMonth]} ${currentYear}`;

            // Encontrar el domingo de la semana actual
            const today = new Date(currentYear, currentMonth, 
                (now.getFullYear() === currentYear && now.getMonth() === currentMonth) ? now.getDate() : 1
            );
            const sunday = new Date(today);
            sunday.setDate(today.getDate() - today.getDay());

            const numIds = ['sun','mon','tue','wed','thu','fri','sat'];
            numIds.forEach((id, i) => {
                const d = new Date(sunday);
                d.setDate(sunday.getDate() + i);
                const el = document.getElementById(`wk-num-${id}`);
                el.textContent = d.getDate();
                const isT = (d.toDateString() === now.toDateString());
                el.className = 'week-day-num' + (isT ? ' today-num' : '');
                // Render slots
                const slots = document.getElementById(`wk-slots-${id}`);
                slots.innerHTML = '';
                for (let h = 0; h < 24; h++) {
                    const slot = document.createElement('div');
                    slot.className = 'week-hour-slot' + (isT && h === now.getHours() ? ' current-hour' : '');
                    slots.appendChild(slot);
                }
            });

            // Times column
            const timesCol = document.getElementById('week-times');
            timesCol.innerHTML = '';
            for (let h = 0; h < 24; h++) {
                const lbl = document.createElement('div');
                lbl.className = 'week-hour-label';
                lbl.textContent = h === 0 ? '' : `${h}:00`;
                timesCol.appendChild(lbl);
            }
        }

        // ── Renderizar vista Día ──
        function renderDia() {
            const d = (now.getFullYear() === currentYear && now.getMonth() === currentMonth) ? now.getDate() : 1;
            calTitle.textContent = `${MESES[currentMonth]} ${currentYear}`;
            document.getElementById('day-title').textContent =
                `${DIAS_CORTOS[new Date(currentYear, currentMonth, d).getDay()]}, ${d} de ${MESES[currentMonth]} ${currentYear}`;

            const body = document.getElementById('day-body');
            body.innerHTML = '';
            const timesCol = document.createElement('div');
            timesCol.style.cssText = 'border-right:1px solid rgba(139,92,246,0.1);';
            const slotsCol = document.createElement('div');
            for (let h = 0; h < 24; h++) {
                const lbl = document.createElement('div');
                lbl.className = 'week-hour-label';
                lbl.textContent = h === 0 ? '' : `${h}:00`;
                timesCol.appendChild(lbl);
                const slot = document.createElement('div');
                slot.className = 'week-hour-slot' + (h === now.getHours() && now.getFullYear() === currentYear && now.getMonth() === currentMonth && now.getDate() === d ? ' current-hour' : '');
                slotsCol.appendChild(slot);
            }
            body.appendChild(timesCol);
            body.appendChild(slotsCol);
        }

        // ── Navegación ──
        document.getElementById('btn-prev').addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            // Solo navegar dentro de 2026
            if (currentYear < 2026) { currentYear = 2026; currentMonth = 0; }
            refreshView();
        });

        document.getElementById('btn-next').addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            if (currentYear > 2026) { currentYear = 2026; currentMonth = 11; }
            refreshView();
        });

        // ── Pestañas de vista ──
        ['mes','semana','dia'].forEach(v => {
            document.getElementById(`tab-${v}`).addEventListener('click', () => {
                currentView = v;
                document.querySelectorAll('.cal-view-tab').forEach(t => t.classList.remove('active'));
                document.getElementById(`tab-${v}`).classList.add('active');
                document.getElementById('view-mes').style.display = v === 'mes' ? 'flex' : 'none';
                document.getElementById('view-semana').style.display = v === 'semana' ? 'block' : 'none';
                document.getElementById('view-dia').style.display = v === 'dia' ? 'block' : 'none';
                refreshView();
            });
        });

        function refreshView() {
            if (currentView === 'mes') renderMes();
            else if (currentView === 'semana') renderSemana();
            else renderDia();
        }

        // Inicial
        renderMes();
    })();
    </script>
